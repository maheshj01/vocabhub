name: vocabhub
description: An App to help you build vocabulary.
publish_to: "none"
version: 0.7.9+32

environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  feature_discovery:
    git:
      url: https://github.com/maheshmnj/feature_discovery.git
      ref: master
  firebase_analytics: ^12.4.1
  firebase_auth: ^6.5.4
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_messaging_web: ^4.1.7
  firebase_remote_config: ^6.5.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^9.1.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  http: ^1.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  navbar_router: ^0.7.7
  package_info_plus: ^10.1.0
  pull_to_refresh: ^2.0.0
  realtime_client: ^2.7.3
  rive: ^0.14.7
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  supabase: ^2.10.6
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  webview_flutter: ^4.13.1
  webview_flutter_web: ^0.2.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  lints: ^6.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#F9F9F9"
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/rive/
    - .env
    - shorebird.yaml
    - CHANGELOG.md
